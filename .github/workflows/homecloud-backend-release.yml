name: "HomeCloudBackend | CI/CD Linux"

# Independent of Jira. Each successful push to main produces a pre-release.
"on":
  push:
    branches:
      - main
  workflow_dispatch:

# Limit repository write access to the release job.
permissions:
  contents: read

# No cancel-in-progress: a build is tied to its exact commit SHA.
jobs:
  validate:
    name: "1. Validate and test Backend"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Show toolchain
        run: go version

      - name: Verify modules
        run: go mod verify

      - name: Ensure module metadata is tidy without modifying it
        run: go mod tidy -diff

      - name: Unit and integration tests
        run: go test -count=1 ./...

      - name: Static analysis
        run: go vet ./...

      - name: Check race conditions in room state manager
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./internal/mediarooms

  linux:
    name: "2. Build Linux x64"
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: "0"
      OUTPUT_NAME: HomeCloudBackend-linux-amd64

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compile Backend from repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/$OUTPUT_NAME" .
          test -s "dist/$OUTPUT_NAME"
          chmod +x "dist/$OUTPUT_NAME"

      - name: Generate Linux SHA-256
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum "$OUTPUT_NAME" > "$OUTPUT_NAME.sha256"
          cat "$OUTPUT_NAME.sha256"

      - name: Upload Linux binary
        uses: actions/upload-artifact@v7
        with:
          name: homecloud-backend-linux-amd64
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: "3. Verify and publish GitHub Release"
    needs:
      - linux
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v7
        with:
          name: homecloud-backend-linux-amd64
          path: downloaded/linux

      - name: Verify checksum and executable format
        shell: bash
        run: |
          set -euo pipefail
          LINUX=HomeCloudBackend-linux-amd64

          test "$(find downloaded/linux -maxdepth 1 -type f | wc -l)" -eq 2
          (
            cd downloaded/linux
            sha256sum -c "$LINUX.sha256"
            test -s "$LINUX"
            # ELF magic.
            test "$(od -An -tx1 -N4 "$LINUX" | tr -d ' \\n')" = 7f454c46
          )

          mkdir -p release-assets
          cp "downloaded/linux/$LINUX" "release-assets/$LINUX"
          chmod +x "release-assets/$LINUX"

      - name: Create release notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'Automated **HomeCloudBackend** Linux build from `main`.'
            echo
            echo "Commit: `$GITHUB_SHA`"
            echo '- Target: Linux amd64'
            echo '- Go version: taken from `go.mod`; CGO disabled for released binary'
            echo '- Tests: `go test`, `go vet`, Linux race test for media rooms'
            echo
            echo '**Runtime:** start the executable with working directory set to your existing Backend directory containing `config/config.yaml` and `data/`. Keep the Media Gateway executable and its config separate. No configuration, database, secrets or Gateway binaries are bundled.'
            echo
            echo '### SHA-256'
            echo '```text'
            cat downloaded/linux/*.sha256
            echo '```'
          } > release_notes.md
          cat release_notes.md

      - name: Publish commit-specific pre-release
        id: publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: backend-build-${{ github.sha }}
          name: "HomeCloudBackend | build ${{ github.sha }}"
          target_commitish: ${{ github.sha }}
          body_path: release_notes.md
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            release-assets/HomeCloudBackend-linux-amd64

      - name: Show published release
        shell: bash
        env:
          RELEASE_URL: ${{ steps.publish.outputs.url }}
        run: |
          echo "Published: $RELEASE_URL"
          echo '### HomeCloudBackend release' >> "$GITHUB_STEP_SUMMARY"
          echo "$RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
