name: "HomeCloudBackend | Pull Request CI"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: "Validate and test Backend"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: homecloud_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d homecloud_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CGO_ENABLED: "0"

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Go from go.mod
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Ensure module metadata is tidy without modifying it
        run: go mod tidy -diff

      - name: Unit and integration tests
        env:
          HOMECLOUD_TEST_POSTGRES_DSN: postgres://postgres:postgres@localhost:5432/homecloud_test?sslmode=disable
        run: go test -count=1 ./...

      - name: Static analysis
        run: go vet ./...

      - name: Check race conditions in state and monitoring managers
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./internal/mediarooms ./internal/monitoring/cpu
